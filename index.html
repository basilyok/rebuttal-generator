<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Write the reply that actually changes their mind" />
    <meta name="theme-color" content="#667eea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rebuttal" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>Rebuttal Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Self-heal from a service worker that corrupted the load of the app itself.
      //
      // This has to be a plain script that runs before the module tag below, not
      // code inside the app — that is the entire point. The in-app "update
      // available" banner (App.tsx) is what normally delivers a service-worker
      // fix, but it is compiled into the very bundle this listens for. If a bad
      // worker breaks that bundle's load, the banner that would fix it never gets
      // a chance to run, and the tab is stuck until the user manually clears
      // storage. This script is the one piece of recovery logic guaranteed to run
      // regardless of whether the main app does.
      //
      // A failed <script type="module"> or stylesheet <link> fires a plain
      // 'error' event on the element — it does not bubble, so this has to listen
      // in the capture phase to see it. On one, unregister every registration and
      // reload once; sessionStorage caps it at one attempt per tab so a genuine
      // outage degrades to a blank page instead of a reload loop.
      //
      // MUST be scoped to our own /assets/ build output, not "any module script
      // on the page" — Cloudflare injects its own Web Analytics beacon as
      // type="module" from static.cloudflareinsights.com, and that domain is on
      // most tracker blocklists (it is what Edge's Tracking Prevention blocks by
      // default for every user, out of the box). An unscoped check fires this
      // recovery path on a blocked analytics call that has nothing to do with
      // whether the app itself loaded.
      const isOurBuildAsset = (el) => {
        const url = el.src || el.href
        if (!url) return false
        try {
          const u = new URL(url, location.href)
          return u.origin === location.origin && u.pathname.startsWith('/assets/')
        } catch {
          return false
        }
      }
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener(
          'error',
          (event) => {
            if (!isOurBuildAsset(event.target)) return
            if (sessionStorage.getItem('sw-recovery-attempted')) return
            sessionStorage.setItem('sw-recovery-attempted', '1')
            navigator.serviceWorker
              .getRegistrations()
              .then((regs) => Promise.all(regs.map((r) => r.unregister())))
              .then(() => location.reload())
              .catch(() => location.reload())
          },
          true
        )
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA support (skip in local dev so the SW
      // never caches Vite dev-server modules)
      if (
        'serviceWorker' in navigator &&
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1'
      ) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('Service Worker registration failed:', err)
          })
        })
      }
    </script>
  </body>
</html>
