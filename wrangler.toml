name = "m36x-rebuttal"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"

# Storage for unlisted share links (/api/share). Create the namespace once with:
#   npx wrangler kv namespace create SHARES
# then paste the returned id below. Without this binding the share endpoint
# returns 501 and the rest of the app is unaffected.
[[kv_namespaces]]
binding = "SHARES"
id = "3ba59116bf3a4f1190b27e16616d9f8e"

# Accounts: sessions, profiles, language preference, and the ENCRYPTED key vault.
# Keys are prefixed — session:<id>, user:<id>, vault:<id>, oauth:<state>, password:<id>.
#
# The vault entries hold ciphertext only. The encryption key is derived in the
# user's browser from a passphrase this server never receives, so a dump of this
# namespace yields nothing usable. See src/vault.ts before changing anything here.
#
#   npx wrangler kv namespace create ACCOUNTS
#
# Without this binding the auth endpoints return 501 and the app behaves exactly
# as it did before sign-in existed.
[[kv_namespaces]]
binding = "ACCOUNTS"
id = "cf639d7e71374271a4ee79c7af834d3f"

# The rate-limiter Worker (limiter/). Service-bound so only our own Functions
# can reach it — it has no public URL. Deploy it first: cd limiter && npx wrangler deploy
[[services]]
binding = "LIMITER"
service = "m36x-limiter"
